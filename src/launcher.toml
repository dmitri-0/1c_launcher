# ==============================================================
#  Настройки лаунчера 1С
#
#  Файл лежит РЯДОМ С exe (в сборке: dist\launcher.toml,
#  в исходниках: src\launcher.toml) и читается динамически
#  при каждом запуске — правка настроек НЕ требует пересборки.
#
#  Удалите/переименуйте файл — будут использованы встроенные
#  значения по умолчанию (те же, что описаны в src/config.py).
# ==============================================================

[base]
# Файл списка баз 1С. Если ключ не задан — путь берётся из %USERPROFILE%.
# ibases_path = 'C:\Users\<user>\AppData\Roaming\1C\1CEStart\ibases.v8i'

# Кодировка файла ibases.v8i
encoding = 'utf-8-sig'

# Путь к обработке инструментов ИР (F5)
ir_tools_path = 'c:\ROOT\CodeBase\1C\Tools\ИР_Портативный\ирПортативный.epf'

# Куда выгружать CF (F8) и писать логи операций (F7 и т.п.)
cf_dump_path = 'D:\CF'
log_path = 'D:\CF\Logs'

# Запуск DBM API (F11)
dbm_python_exe = 'c:\ROOT\CodeBase\Py\dbm_api\venv\Scripts\python.exe'
dbm_script_path = 'c:\ROOT\CodeBase\Py\dbm_api\app.py'
dbm_api_dir = 'c:\ROOT\CodeBase\Py\dbm_api'

[hotkey]
# Глобальная горячая клавиша вызова окна из любого места,
# а также аварийного сброса ожидания закрытия (после Del).
#
# modifiers — модификаторы через '+' (латиницей, регистр не важен):
#   'Alt', 'Ctrl', 'Shift', 'Win'  (например 'Alt+Shift')
# либо число: MOD_ALT=1, MOD_CONTROL=2, MOD_SHIFT=4, MOD_WIN=8
#   (несколько — сложением: Alt+Ctrl+Shift = 7)
modifiers = 'Alt'

# vk — виртуальный код клавиши:
#   0x44 = D, 0x43 = C, 0x31 = 1, 0x70 = F1, 0x71 = F2 и т.д.
vk = 0x44

[notes]
# Путь к БД заметок (SQLite). Пустая строка = notes.db рядом с exe (портативно).
path = ''

# Отслеживаемые приложения для узла «Основное» (меняется без пересборки)
[[tracked_applications]]
process_name = 'reasonix-desktop.exe'
display_name = 'Rx'
icon = '❯_'
launch_path = 'c:\ROOT\Reasonix-windows-amd64\Reasonix.exe'

