[project]
name = "1c-launcher"
version = "0.1.0"
description = "Лончер для баз данных 1С"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.11"  # внешний конфиг launcher.toml читается через stdlib tomllib
license = {text = "MIT"}

dependencies = [
    # requests — для vendored клиента DBM API (src/databases_api.py);
    # PyInstaller упакует его вместе с зависимостями (urllib3, certifi, idna…)
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "flake8>=7.0.0",
    "black>=24.0.0",
    "pylint>=3.0.0",
    "mypy>=1.8.0",
]

gui = [
    # Раскомментировать при добавлении GUI
    # "PyQt6>=6.6.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.setuptools.packages.find]
where = ["src"]
